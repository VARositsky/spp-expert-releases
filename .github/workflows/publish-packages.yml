name: Publish compiled SPP-Expert packages
on:
  push:
    paths:
      - '.github/workflows/publish-packages.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and extract compiled packages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          packages = [{"url":"https://sdmntprnortheu.oaiusercontent.com/files/00000000-03c0-81f4-aff2-95f60b3ea0a6/raw?se=2026-11-26T21%3A17%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=01a219a1-6456-7bc3-9174-a80cd35b4d41&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T06%3A15%3A22Z&ske=2026-11-27T06%3A15%3A22Z&sks=b&skv=2026-06-06&sig=LCqtSUJIwb3yIUZIlS4Hn%2BbJjFsKHBYAFCH0m1%2BBzEI%3D","sha256":"abb453af43c3731e77c5fa658efcac4ea7a35ae7289089d1ab279e2321b82c96","output":"SPP-Expert-Windows.zip","ext":".zip"},{"url":"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1ed4-8210-b30b-94ec161fe51e/raw?se=2026-11-26T21%3A17%3A04Z&sp=r&sv=2026-06-06&sr=b&scid=01a219a1-6456-7bc3-9174-a80cd35b4d41&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T05%3A03%3A40Z&ske=2026-11-27T05%3A03%3A40Z&sks=b&skv=2026-06-06&sig=scEyuOMUAgpK5m7FdgB7OiaZEwGrVpfQ59PqkBC1lUs%3D","sha256":"85784b7b84b22364a0c200345c7303f4a74130133a48d9e684f036ffb12f9d86","output":"SPP-Expert-Android.apk","ext":".apk"}]
          pathlib.Path('dist').mkdir(exist_ok=True)
          for package in packages:
              with urllib.request.urlopen(package['url'], timeout=120) as response:
                  archive = response.read()
              assert hashlib.sha256(archive).hexdigest() == package['sha256'], 'Artifact checksum mismatch'
              with zipfile.ZipFile(io.BytesIO(archive)) as outer:
                  files = [x for x in outer.infolist() if not x.is_dir()]
                  assert len(files) == 1 and files[0].filename.lower().endswith(package['ext']), 'Unexpected artifact contents'
                  compiled = outer.read(files[0])
              with zipfile.ZipFile(io.BytesIO(compiled)) as inner:
                  names = inner.namelist()
                  if package['ext'] == '.zip':
                      assert any(x.endswith('energy_trainer.exe') for x in names), 'Windows executable missing'
                  else:
                      assert 'AndroidManifest.xml' in names, 'Android manifest missing'
              pathlib.Path('dist', package['output']).write_bytes(compiled)
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in sorted(pathlib.Path('dist').iterdir())]
          pathlib.Path('dist/SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          pathlib.Path('release-notes.md').write_text("Серверная сборка СПП-Эксперт от 26.11.2026.\n\nПодготовка по билетам, серверная аттестация, проверка письменных ответов, редактор и просмотр результатов сотрудников своей организации. После сдачи доступен возврат в главное меню с сохранением просмотра вопросов.\n\nФайлы:\n- Windows: SPP-Expert-Windows.zip — полностью распакуйте и запустите energy_trainer.exe.\n- Android: SPP-Expert-Android.apk — установите APK. Пакет использует тестовую подпись; для обновления поверх прежней версии нужна совместимая подпись.\n- SHA256SUMS.txt — контрольные суммы опубликованных пакетов.\n\nДля входа требуется учётная запись, выданная организатором. Общая инструкция находится в README репозитория.\n\nОпубликованы готовые пакеты приложения. Исходники приложения и данные входа в релиз не включены.\n", encoding='utf-8')
          PY
      - name: Publish application packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VARositsky/spp-expert-releases
        shell: bash
        run: |
          gh release create server-2026-11-26 --draft --title 'СПП-Эксперт — серверная сборка 26.11.2026' --notes-file release-notes.md
          gh release upload server-2026-11-26 dist/SPP-Expert-Windows.zip dist/SPP-Expert-Android.apk dist/SHA256SUMS.txt
          gh release edit server-2026-11-26 --draft=false --latest
